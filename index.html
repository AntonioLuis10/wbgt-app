                glossary_html: `
                    <h3 style="margin-top: 0; color: #1c1c1e; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Glosario de Protocolos Fisiológicos</h3>
                    
                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">1. Eu-hidratación (El Punto de Equilibrio)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">La eu-hidratación es, simplemente, el estado de hidratación normal y saludable de tu cuerpo.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>Qué significa en la práctica:</strong> Significa comenzar a correr en un estado de equilibrio óptimo: ni deshidratado (hipohidratado) ni sobrehidratado.</li>
                            <li><strong>Cómo se logra:</strong> Con una ingesta de agua estándar y regular en las horas previas al entrenamiento. En condiciones de Riesgo Bajo (Bandera Verde), salir en estado de eu-hidratación es más que suficiente para aguantar hasta 90 minutos sin beber, ya que tu cuerpo puede compensar la pérdida de sudor de forma segura sin que se altere tu salud ni tu rendimiento.</li>
                        </ul>
                    </div>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">2. Hiperhidratación (La Reserva Interna)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">La hiperhidratación es el proceso de expandir artificialmente tu volumen de agua corporal (tanto en el torrente sanguíneo como en los tejidos) por encima de los niveles normales antes de salir a correr, creando un "tanque de reserva" interno para que sudes ese líquido en lugar del de tus venas, todo sin tener que cargar peso externo en la cintura o espalda.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>Por qué no basta con beber agua sola:</strong> Si bebes agua en exceso antes de correr, tus riñones la detectarán rápidamente y la eliminarán a través de la orina (diuresis). Por eso, las fuentes detallan dos protocolos de hiperhidratación osmótica que usan "anclas" para retener esa agua en el cuerpo:</li>
                            <li><strong>Protocolo de Sodio:</strong> Ingerir de 10 a 12 gramos de sal común (NaCl) disueltos en agua (10-15 mL por cada kilo de tu peso) entre 60 y 90 minutos antes de correr. El sodio retiene el agua dentro de tus vasos sanguíneos, aportando un extra de 400 a 600 mL de plasma destinados exclusivamente a la sudoración.</li>
                            <li><strong>Protocolo de Glicerol:</strong> Tomar 1,2 gramos de glicerol por kilo de peso con abundante agua (25-30 mL/kg) en las 2 horas previas. El glicerol penetra las células y retiene agua tanto dentro como fuera de ellas, lo que frena la subida de las pulsaciones (deriva cardíaca) durante la carrera.</li>
                        </ul>
                    </div>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">3. Pre-cooling Agresivo (El Escudo Térmico)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">El pre-cooling agresivo (o preenfriamiento) agrupa técnicas físicas y metabólicas para bajar tu temperatura corporal central (rectal) y cutánea por debajo de lo normal antes de empezar a correr. Al "enfriar el motor" por adelantado, aumentas el margen o la capacidad de tu cuerpo para almacenar calor antes de llegar al peligroso límite de la hipertermia (temperatura interna > 40 °C).</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>La técnica del Granizado de Hielo (Ice Slurry):</strong> Es el método interno más eficaz. Consiste en ingerir un granizado de hielo picado (7,5 gramos por kilo de peso) unos 30 minutos antes de la salida. Al derretirse el hielo dentro de tu estómago, pasa de sólido a líquido y absorbe una inmensa cantidad de energía térmica (calor latente de fusión), logrando desplomar tu temperatura interna entre 0,3 °C y 0,6 °C antes de correr.</li>

                        </ul>
                    </div>`

                glossary_html: `
                    <h3 style="margin-top: 0; color: #1c1c1e; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Glossary of Physiological Protocols</h3>
                    
                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">1. Euhydration (The Balance Point)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">Euhydration is simply the normal and healthy hydration state of your body.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>What it means in practice:</strong> It means starting to run in an optimal state of balance: neither dehydrated (hypohydrated) nor overhydrated.</li>
                            <li><strong>How to achieve it:</strong> With standard and regular water intake in the hours leading up to training. Under Low Risk conditions (Green Flag), starting in a state of euhydration is more than enough to last up to 90 minutes without drinking, as your body can safely compensate for sweat loss without affecting your health or performance.</li>
                        </ul>
                    </div>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">2. Hyperhydration (The Internal Reserve)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">Hyperhydration is the process of artificially expanding your body water volume (both in the bloodstream and in tissues) above normal levels before running, creating an internal "reserve tank" so you sweat that liquid instead of the one in your veins, all without having to carry external weight on your waist or back.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>Why drinking just water isn't enough:</strong> If you drink excessive water before running, your kidneys will quickly detect it and eliminate it through urine (diuresis). Therefore, sources detail two osmotic hyperhydration protocols that use "anchors" to retain that water in the body:</li>
                            <li><strong>Sodium Protocol:</strong> Ingest 10 to 12 grams of common salt (NaCl) dissolved in water (10-15 mL per kilo of your weight) between 60 and 90 minutes before running. Sodium retains water inside your blood vessels, providing an extra 400 to 600 mL of plasma exclusively dedicated to sweating.</li>
                            <li><strong>Glycerol Protocol:</strong> Take 1.2 grams of glycerol per kilo of body weight with plenty of water (25-30 mL/kg) in the 2 hours prior. Glycerol penetrates cells and retains water both inside and outside them, which slows down the rise in heart rate (cardiovascular drift) during the run.</li>
                        </ul>
                    </div>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">3. Aggressive Pre-cooling (The Thermal Shield)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">Aggressive pre-cooling groups physical and metabolic techniques to lower your core (rectal) and skin body temperature below normal before you start running. By "cooling the engine" in advance, you increase the capacity of your body to store heat before reaching the dangerous limit of hyperthermia (internal temperature > 40 °C).</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>The Ice Slurry Technique:</strong> It is the most effective internal method. It consists of ingesting crushed ice slurry (7.5 grams per kilo of body weight) about 30 minutes before the start. As the ice melts inside your stomach, it changes from solid to liquid and absorbs an immense amount of thermal energy (latent heat of fusion), plummeting your internal temperature by 0.3 °C to 0.6 °C before running.</li>
                            <li><strong>Combined External Cooling:</strong> It is complemented by applying direct cold to the exterior (using ice vests or cold packs on the neck and groin) for 20 or 30 minutes to cool the blood passing through large arteries (carotid and femoral), delaying the need for your body to pump blood to the skin to cool down.</li>
                        </ul>
                    </div>`
            },
            fr: {

                btn_calc: "Estimer le WBGT",

                chart_title: "Prévisions WBGT (Prochaines 24h)",
                chart_desc: "Touchez un point de la courbe pour voir le protocole d'hydratation",
                footer_text: "Cet outil informatique estime l'indice WBGT en utilisant le modèle thermodynamique de Liljegren pour les environnements extérieurs. Il évalue le risque de stress thermique selon la norme ISO 7243 en fonction de la température de l'air, de l'humidité, de la vitesse du vent et du rayonnement solaire.",

                flag_green: "Drapeau Vert",
                flag_green_txt: "<strong>Risque Faible:</strong> Poids Zéro jusqu'à 90 min. Nécessite une eu-hydratation préalable standard.",

                    <h3 style="margin-top: 0; color: #1c1c1e; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Glossaire des Protocoles Physiologiques</h3>
                    
                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">1. Eu-hydratation (Le Point d'Équilibre)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">L'eu-hydratation est simplement l'état d'hydratation normal et sain de votre corps.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>Ce que cela signifie en pratique :</strong> Cela signifie commencer à courir dans un état d'équilibre optimal : ni déshydraté (hypohydraté) ni surhydraté.</li>
                            <li><strong>Comment y parvenir :</strong> Avec un apport d'eau standard et régulier dans les heures précédant l'entraînement. Dans des conditions de Risque Faible (Drapeau Vert), commencer dans un état d'eu-hydratation est plus que suffisant pour tenir jusqu'à 90 minutes sans boire, car votre corps peut compenser en toute sécurité la perte de sueur sans altérer votre santé ni vos performances.</li>

                    </div>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">2. Hyperhydratation (La Réserve Interne)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">L'hyperhydratation est le processus d'expansion artificielle de votre volume d'eau corporelle (à la fois dans la circulation sanguine et dans les tissus) au-dessus des niveaux normaux avant de courir, créant un "réservoir de réserve" interne pour que vous transpiriez ce liquide au lieu de celui de vos veines, le tout sans avoir à porter de poids externe à la taille ou sur le dos.</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>Pourquoi boire seulement de l'eau ne suffit pas :</strong> Si vous buvez de l'eau en excès avant de courir, vos reins la détecteront rapidement et l'élimineront par l'urine (diurèse). C'est pourquoi les sources détaillent deux protocoles d'hyperhydratation osmotique qui utilisent des "ancrages" pour retenir cette eau dans le corps :</li>

                    <div style="margin-top: 15px;">
                        <h4 style="margin: 0 0 5px 0; color: #007aff; font-size: 15px;">3. Pré-refroidissement Agressif (Le Bouclier Thermique)</h4>
                        <p style="font-size: 13px; color: #333; line-height: 1.5; margin-top: 0;">Le pré-refroidissement agressif regroupe des techniques physiques et métaboliques pour abaisser votre température corporelle centrale (rectale) et cutanée en dessous de la normale avant de commencer à courir. En "refroidissant le moteur" à l'avance, vous augmentez la marge ou la capacité de votre corps à stocker de la chaleur avant d'atteindre la limite dangereuse de l'hyperthermie (température interne > 40 °C).</p>
                        <ul style="font-size: 13px; color: #333; line-height: 1.5; padding-left: 20px; margin-top: 5px;">
                            <li><strong>La technique de la Glace Pilée (Ice Slurry) :</strong> C'est la méthode interne la plus efficace. Elle consiste à ingérer de la glace pilée (7,5 grammes par kilo de poids corporel) environ 30 minutes avant le départ. En fondant dans votre estomac, la glace passe de l'état solide à l'état liquide et absorbe une immense quantité d'énergie thermique (chaleur latente de fusion), faisant chuter votre température interne de 0,3 °C à 0,6 °C avant de courir.</li>
                            <li><strong>Refroidissement Externe Combiné :</strong> Il est complété par l'application de froid direct à l'extérieur (à l'aide de gilets de glace ou de compresses froides sur le cou et l'aine) pendant 20 ou 30 minutes pour refroidir le sang passant par les grandes artères (carotides et fémorales), retardant ainsi le besoin de votre corps de pomper du sang vers la peau pour se refroidir.</li>
                        </ul>
                    </div>`
            }
        };

        let currentLang = 'es';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });

            document.getElementById('city-search').placeholder = t.search_placeholder;
            document.getElementById('glossary-card').innerHTML = t.glossary_html;

            if (document.getElementById('result-card').style.display === 'block') {
                calculateWBGT(); 
            }
        }

        window.onload = function() { changeLanguage('es'); };

        // --- LÓGICA DE LA APLICACIÓN ---

        function getRiskData(wbgt) {
            const t = i18n[currentLang];
            if (wbgt > 28.9) return { color: '#000000', font: '#fff', title: t.flag_black, text: t.flag_black_txt };
            if (wbgt >= 27.3) return { color: '#ff3b30', font: '#fff', title: t.flag_red, text: t.flag_red_txt };
            if (wbgt >= 25.1) return { color: '#ff9500', font: '#fff', title: t.flag_orange, text: t.flag_orange_txt };
            if (wbgt >= 22.2) return { color: '#ffcc00', font: '#000', title: t.flag_yellow, text: t.flag_yellow_txt };
            return { color: '#34c759', font: '#fff', title: t.flag_green, text: t.flag_green_txt };
        }

        let selectedLat = null, selectedLon = null, selectedLocation = "", searchTimeout = null;

        async function getSuggestions() {
            const query = document.getElementById('city-search').value;
            const box = document.getElementById('suggestions-box');
            selectedLat = null; 
            
            if (query.length < 3) { box.style.display = 'none'; return; }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=${currentLang}&format=json`);
                    const data = await res.json();
                    box.innerHTML = '';
                    if (data.results && data.results.length > 0) {
                        data.results.forEach(city => {
                            let parts = [city.name];
                            if (city.admin3 && !parts.includes(city.admin3)) parts.push(city.admin3);
                            if (city.admin2 && !parts.includes(city.admin2)) parts.push(city.admin2);
                            if (city.admin1 && !parts.includes(city.admin1)) parts.push(city.admin1);
                            if (city.country && !parts.includes(city.country)) parts.push(city.country);
                            const fullName = parts.join(', ');
                            let div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = fullName;
                            div.onclick = function() {
                                document.getElementById('city-search').value = fullName;
                                selectedLat = city.latitude; selectedLon = city.longitude; selectedLocation = fullName;
                                box.style.display = 'none';
                                fetchWeather(); 
                            };
                            box.appendChild(div);
                        });
                        box.style.display = 'block';
                    } else box.style.display = 'none';
                } catch (e) {}
            }, 300);
        }

        document.addEventListener('click', function(e) {
            if (e.target.id !== 'city-search') document.getElementById('suggestions-box').style.display = 'none';
        });
async function fetchWeather() {
            const query = document.getElementById('city-search').value;
            if (!query) return;
            const loading = document.getElementById('city-loading');
            const t = i18n[currentLang];
            loading.style.display = 'block';
            loading.style.color = '#007aff';
            loading.innerText = t.msg_loading;
            
            try {
                let lat = selectedLat, lon = selectedLon, locName = selectedLocation;
                if (lat === null) {
                    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=${currentLang}&format=json`);
                    const geoData = await res.json();
                    if (!geoData.results) throw new Error("No encontrada");
                    const city = geoData.results[0];
                    lat = city.latitude; lon = city.longitude;
                    let parts = [city.name];
                    if (city.admin3 && !parts.includes(city.admin3)) parts.push(city.admin3);
                    if (city.admin2 && !parts.includes(city.admin2)) parts.push(city.admin2);
                    if (city.admin1 && !parts.includes(city.admin1)) parts.push(city.admin1);
                    if (city.country && !parts.includes(city.country)) parts.push(city.country);
                    locName = parts.join(', ');
                    document.getElementById('city-search').value = locName;
                }
                document.getElementById('suggestions-box').style.display = 'none';
                const response = await fetch(`/api/weather?lat=${lat}&lon=${lon}&loc=${encodeURIComponent(locName)}`);
                if (!response.ok) throw new Error("Error en servidor");
                const data = await response.json();
                
                document.getElementById('ta').value = data.current.ta;
                document.getElementById('rh').value = data.current.rh;
                document.getElementById('v').value = data.current.v;
                document.getElementById('sr').value = data.current.sr;
                
                calculateWBGT();
                // AQUÍ LE PASAMOS LOS DATOS DE 15 MINUTOS A LA GRÁFICA
                await renderChart(data.minutely_15);
                
                loading.style.color = '#34c759';
                loading.innerText = t.msg_success + data.location + "!";
            } catch (error) {
                loading.style.color = '#ff3b30';
                loading.innerText = t.msg_error;
            }
        }

        async function calculateWBGT() {
            const data = {
                ta: parseFloat(document.getElementById('ta').value),
                rh: parseFloat(document.getElementById('rh').value),
                v: parseFloat(document.getElementById('v').value),
                sr: parseFloat(document.getElementById('sr').value)
            };
            if (Object.values(data).some(isNaN)) return;
            try {
                const response = await fetch(`/api/wbgt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                const resultCard = document.getElementById('result-card');
                resultCard.style.display = 'block';
                document.getElementById('wbgt-value').innerText = result.wbgt + " °C";
                
                const riskInfo = getRiskData(result.wbgt);
                document.getElementById('risk-text').innerText = riskInfo.title;
                resultCard.style.backgroundColor = riskInfo.color;
                resultCard.style.color = riskInfo.font;
            } catch (error) {}
        }

        let wbgtChartInstance = null;
        // RECIBIMOS LOS DATOS DE 15 EN 15 MINUTOS
        let wbgtChartInstance = null;
        async function renderChart(minutelyData) {
            document.getElementById('chart-card').style.display = 'block';
            document.getElementById('chart-comment').style.display = 'none';

            // 1. Buscamos en qué índice temporal estamos AHORA MISMO
            const now = new Date();
            let startIndex = minutelyData.time.findIndex(t => new Date(t) >= now);
            
            // Retrocedemos 1 punto (15 min) para que la gráfica empiece enganchada al instante actual
            if (startIndex === -1) {
                startIndex = 0;
            } else if (startIndex > 0) {
                startIndex -= 1;
            }

            // 2. Recortamos los arrays para coger exactamente los próximos 96 puntos (24 horas)
            const times = minutelyData.time.slice(startIndex, startIndex + 96);
            const tas = minutelyData.temperature_2m.slice(startIndex, startIndex + 96);
            const rhs = minutelyData.relative_humidity_2m.slice(startIndex, startIndex + 96);
            const vs = minutelyData.wind_speed_10m.slice(startIndex, startIndex + 96);
            const srs = minutelyData.shortwave_radiation.slice(startIndex, startIndex + 96);

            const labels = [];
            const wbgtPromises = [];

            for (let i = 0; i < times.length; i++) {
                const date = new Date(times[i]);
                // Generamos la etiqueta de texto (Ej: 10:15)
                const mins = date.getMinutes().toString().padStart(2, '0');
                labels.push(date.getHours() + ":" + mins);
                
                const payload = { ta: tas[i], rh: rhs[i], v: vs[i], sr: srs[i] };
                wbgtPromises.push(
                    fetch('/api/wbgt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                    .then(res => res.json())
                );
            }

            const results = await Promise.all(wbgtPromises);
            const wbgtValues = results.map(r => r.wbgt);
            const ctx = document.getElementById('wbgtChart').getContext('2d');
            if (wbgtChartInstance) wbgtChartInstance.destroy();

            wbgtChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'WBGT (°C)',
                        data: wbgtValues,
                        backgroundColor: 'rgba(0, 122, 255, 0.05)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        segment: { borderColor: ctx => getRiskData(ctx.p1.parsed.y).color },
                        pointBackgroundColor: context => getRiskData(context.dataset.data[context.dataIndex]).color,
                        pointRadius: 4, 
                        pointHoverRadius: 8
                    }]
                },
                options: { 
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    onClick: (event, elements) => {
                        const commentDiv = document.getElementById('chart-comment');
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const val = wbgtValues[index];
                            const risk = getRiskData(val);
                            
                            commentDiv.style.display = 'block';
                            commentDiv.style.borderLeft = `6px solid ${risk.color}`;
                            commentDiv.innerHTML = `<strong style="font-size: 15px;">Hora: ${labels[index]} | WBGT: ${val}°C</strong><br><span style="font-weight: 700; color: ${risk.color === '#ffcc00' ? '#d4a000' : risk.color};">${risk.title}</span><br><div style="margin-top: 6px;">${risk.text}</div>`;
                        }
                    }
                }
            });
        }
        
    </script>
</body>
</html>
